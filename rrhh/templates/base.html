<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión de Planillas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #121212;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #1e1e1e;
            padding: 20px;
            transition: all 0.3s;
        }
        .sidebar a {
            color: #ffffff;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .sidebar a:hover {
            background-color: #343a40;
        }
        .content {
            margin-left: 260px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h4 class="text-light">Planillas</h4>
        <a href="{% url 'inicio' %}">🏠 Inicio</a>
        <a href="{% url 'empleados' %}">👥 Empleados</a>
        <a href="{% url 'nominas' %}">📄 Nóminas</a>
        <a href="{% url 'prestaciones' %}">💰 Prestaciones</a>
        <a href="{% url 'reportes' %}">📊 Reportes</a>
        <hr class="text-light">
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
        </form>
    </div>

    <!-- Contenido Principal -->
    <div class="content">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow rounded-3 p-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Gestión de Planillas</a>
            </div>
        </nav>

        <div class="mt-4">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
