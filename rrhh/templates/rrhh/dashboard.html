{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="text-light">📊 Dashboard</h2>
    <div class="row">
        <div class="col-md-3">
            <div class="card bg-secondary text-light shadow-lg rounded-3 p-3">
                <h5>👥 Empleados</h5>
                <p class="fs-3 fw-bold">120</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-secondary text-light shadow-lg rounded-3 p-3">
                <h5>📄 Nóminas</h5>
                <p class="fs-3 fw-bold">36</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-secondary text-light shadow-lg rounded-3 p-3">
                <h5>💰 Prestaciones</h5>
                <p class="fs-3 fw-bold">$15,000</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-secondary text-light shadow-lg rounded-3 p-3">
                <h5>📊 Reportes</h5>
                <p class="fs-3 fw-bold">8</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
