{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<style>
    /* Fondo oscuro con una imagen de fondo */
    body {
        background: url('https://source.unsplash.com/1600x900/?office,technology') no-repeat center center fixed;
        background-size: cover;
        margin: 0;
        height: 100vh;
    }

    /* Contenedor del login centrado */
    .login-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        padding: 25px;
        border-radius: 15px;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.1);
    }

    /* Estilos del formulario */
    .form-control {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: none;
        border-radius: 10px;
    }

    .form-control:focus {
        background: rgba(255, 255, 255, 0.2);
        box-shadow: none;
    }

    .btn-primary {
        background: #1d3557;
        border: none;
    }

    .btn-primary:hover {
        background: #457b9d;
    }
</style>

<!-- Contenedor del formulario -->
<div class="login-container">
    <div class="text-center">
        <h3 class="fw-bold text-light">Bienvenido</h3>
        <p class="text-muted">Inicia sesión para continuar</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_username" class="form-label fw-bold text-light">Usuario</label>
            <input type="text" name="username" id="id_username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="id_password" class="form-label fw-bold text-light">Contraseña</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">Ingresar</button>
    </form>
    <p class="mt-3 text-center">
        <a href="#" class="text-decoration-none text-light">¿Olvidaste tu contraseña?</a>
    </p>
</div>
{% endblock %}
